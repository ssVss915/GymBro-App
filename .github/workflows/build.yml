name: Android Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Unzip project
      run: unzip gymbro.zip -d .

    - name: Auto-Inject Logo & Edit Manifest
      run: |
        mkdir -p app/src/main/res/drawable
        mv app_logo.png app/src/main/res/drawable/
        sed -i 's/android:icon="[^"]*"/android:icon="@drawable\/app_logo"/g' app/src/main/AndroidManifest.xml
        sed -i 's/android:roundIcon="[^"]*"/android:roundIcon="@drawable\/app_logo"/g' app/src/main/AndroidManifest.xml

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Generate missing Gradle Wrapper
      run: gradle wrapper

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Generate Debug Keystore
      run: keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "C=US, O=Android, CN=Android Debug"

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        
